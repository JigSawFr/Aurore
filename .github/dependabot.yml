# Weekly updates of the pinned actions (SHA and version comment together) and of the Gradle wrapper
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
    commit-message:
      prefix: ci
  - package-ecosystem: gradle
    directory: /android-project
    schedule:
      interval: monthly
    commit-message:
      prefix: build
  # library/boreale-site: what Boréale's sites share, followed on its main.
  # Only it: the other submodules (glfw, SDL) are moved by hand.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: library/boreale-site
    commit-message:
      prefix: chore
      include: scope

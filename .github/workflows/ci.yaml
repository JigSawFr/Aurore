name: Build the Aurore demo

on:
  push:
    branches: [ main ]
  pull_request:

# A new push to a pull request stops the run of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      # The version .clang-format is written for, from PyPI: the same on any
      # runner, whichever clang-format its Ubuntu ships
      CLANG_FORMAT_VERSION: 18.1.8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install -q "clang-format==$CLANG_FORMAT_VERSION"
          git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.m' '*.mm' ':!:**/extern/**' \
            | xargs "$RUNNER_TEMP/clang-format/bin/clang-format" --dry-run --Werror

  # Each file says its licence and copyright, in SPDX tags or REUSE.toml, and
  # each licence named has its text in LICENSES/ (CONTRIBUTING.md)
  licenses:
    name: licences (REUSE)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      REUSE_VERSION: 6.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install -q "reuse==$REUSE_VERSION"
          "$RUNNER_TEMP/reuse/bin/reuse" lint
  ios:
    # macOS 27 and Xcode 27 (the SDKs for iOS 27 and macOS 27), a preview image
    runs-on: xcode-27
    # Not required: GitHub's macOS runners sometimes leave the job without a
    # machine until it is cancelled. A failure here is still shown, and
    # looked at, but does not make the run fail (CONTRIBUTING.md).
    continue-on-error: true
    timeout-minutes: 40
    name: ios (${{ matrix.window }})
    strategy:
      fail-fast: false
      matrix:
        window: [ sdl2, sdl3 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: cache
        id: cache-key
        run: echo "IOS_CACHE_KEY=ios-${{ matrix.window }}-cmake-build-dir-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '.github/workflows/ci.yaml') }}-${{ github.sha }}" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ios-cache
        with:
          path: build
          key: ${{ steps.cache-key.outputs.IOS_CACHE_KEY }}
          restore-keys: ios-${{ matrix.window }}-cmake-build-dir-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '.github/workflows/ci.yaml') }}-
      - name: Build
        run: |
          ./build_libromfs_generator.sh
          cmake -B build -G Xcode -DAURORE_PLATFORM=IOS -DAURORE_WINDOW=${{ matrix.window }} -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=27.0
          cmake --build build
          ditto -ck --rsrc --sequesterRsrc --keepParent build/Debug-iphoneos/aurore_demo.app aurore_demo.zip
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !steps.ios-cache.outputs.cache-hit }}
        with:
          path: build
          key: ${{ steps.cache-key.outputs.IOS_CACHE_KEY }}
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-ios-${{ matrix.window }}
          path: aurore_demo.zip

  ps4:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # The image from its recipe: PacBrew's OpenOrbis with LLVM 23. Building it
      # takes 5 minutes; GitHub's cache keeps it while ps4/scripts/ stays the same
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ps4/scripts
          tags: aurore-ps4
          load: true
          cache-from: type=gha,scope=ps4
          cache-to: type=gha,scope=ps4,mode=max
      - name: Build
        run: |
          docker run --rm -v $(pwd):/src/ aurore-ps4 \
            "cmake -B build -DAURORE_PLATFORM=PS4 \
                -DCMAKE_BUILD_TYPE=Release && \
                make -C build -j$(nproc)"
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-ps4
          path: build/*.pkg

  psv:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: gxm }
          - { driver: gles2 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # The image from its recipe: VitaSDK (GCC 15.2), PVR_PSP2 and SDL2.
      # GitHub's cache keeps it while psv/scripts/ stays the same, as the PS4's
      - name: Set up Buildx
        if: ${{ matrix.driver == 'gles2' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: GLES2 toolchain image
        if: ${{ matrix.driver == 'gles2' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: psv/scripts
          tags: aurore-vita-gles2
          load: true
          cache-from: type=gha,scope=psv-gles2
          cache-to: type=gha,scope=psv-gles2,mode=max
      - name: Build GLES2
        if: ${{ matrix.driver == 'gles2' }}
        run: |
          docker run --rm -v $(pwd):/src/ aurore-vita-gles2 \
            "cmake -B build -G Ninja -DAURORE_PLATFORM=PSV -DUSE_SYSTEM_SDL2=ON -DCMAKE_BUILD_TYPE=Release && \
             cmake --build build"

      - name: Build GXM
        if: ${{ matrix.driver == 'gxm' }}
        run: |
          echo "cd /src" > build_gxm.sh
          echo "cmake -B build -DAURORE_PLATFORM=PSV -DCMAKE_BUILD_TYPE=Release -DAURORE_GRAPHICS=GXM" >> build_gxm.sh
          echo "cmake --build build -- -j$(nproc)" >> build_gxm.sh
          docker run --rm -v $(pwd):/src/ vitasdk/vitasdk@sha256:61c173463b3d10d71464b6fc591f1fe1018736bf2e321e6852db06612eb05b07 sh -C /src/build_gxm.sh

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-psv-${{ matrix.driver }}
          path: build/*.vpk

  switch:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 300M
    strategy:
      fail-fast: false
      matrix:
        driver: [ glfw, sdl2, deko3d ]
        include:
          - { driver: glfw, cmake: "-DAURORE_WINDOW=GLFW", ext: "gl3-glfw" }
          - { driver: sdl2, cmake: "-DAURORE_WINDOW=SDL2", ext: "gl3-sdl2" }
          - { driver: deko3d, cmake: "-DAURORE_GRAPHICS=DEKO3D", ext: "deko3d" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # ccache in the devkitPro image, its objects in GitHub's cache from one
      # run to the next, as PlayGuard's Switch build
      - name: ccache
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-switch-${{ matrix.driver }}-${{ github.sha }}
          restore-keys: ccache-switch-${{ matrix.driver }}-
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAURORE_PLATFORM=SWITCH ${{ matrix.cmake }}
          make -C build aurore_demo.nro -j$(nproc)
          ccache --show-stats
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-switch-${{ matrix.ext }}
          path: build/aurore_demo.nro

  # The Switch demo with devkitA64 r30 (GCC 16.1), which devkitPro published
  # as packages but not yet as an image: switch/scripts/Dockerfile puts r30
  # over the image the jobs above pin, libnx unchanged. Not required until a
  # build has run on a console; GitHub's cache keeps the image while
  # switch/scripts/ stays the same.
  switch-gcc16:
    name: switch (gcc 16)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: switch/scripts
          tags: aurore-devkita64-r30
          load: true
          cache-from: type=gha,scope=devkita64-r30
          cache-to: type=gha,scope=devkita64-r30,mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-switch-gcc16-${{ github.sha }}
          restore-keys: ccache-switch-gcc16-
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -e CCACHE_DIR=/src/.ccache -e CCACHE_BASEDIR=/src -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=300M \
            aurore-devkita64-r30 sh -c '
              git config --global --add safe.directory '*' 2> /dev/null
              /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc --version | head -1
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DAURORE_PLATFORM=SWITCH -DAURORE_GRAPHICS=DEKO3D &&
              make -C build aurore_demo.nro -j$(nproc) &&
              ccache --show-stats'
          # The container wrote as root
          sudo chown -R "$(id -u):$(id -g)" build .ccache
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-switch-deko3d-gcc16
          path: build/aurore_demo.nro

  # The New 3DS before its renderer: the library and a smoke test on the console
  # (docs/platforms.md)
  ctr:
    name: 3ds
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:20260610@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 300M
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # ccache in the devkitPro image, as the Switch jobs
      - name: ccache
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-3ds-${{ github.sha }}
          restore-keys: ccache-3ds-
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAURORE_PLATFORM=3DS
          cmake --build build -j$(nproc)
          ccache --show-stats
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-3ds-smoke
          path: build/ctr/aurore_3ds_smoke.3dsx
      - name: Upload the demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-3ds-demo
          path: build/aurore_demo.3dsx

  gradle-wrapper:
    name: android (Gradle wrapper)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Without the submodules: SDL's own Android project carries an old wrapper Aurore does not run
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    name: android (sdl${{ matrix.sdl }})
    strategy:
      fail-fast: false
      matrix:
        sdl: [ 2, 3 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build pkg-config
      # Gradle's distribution and dependencies kept from one run to the next
      # (not setup-gradle: it validates SDL's own wrappers too, which the
      # job above leaves out, and caches through a proprietary provider)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-project/**/*.gradle*', 'android-project/gradle/wrapper/gradle-wrapper.properties', 'android-project/gradle/libs.versions.toml') }}
          restore-keys: gradle-
      - name: Build
        id: build
        run: |
          ./build_libromfs_generator.sh
          cd android-project && ./gradlew assembleDebug -PauroreSdl=${{ matrix.sdl }}
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-android-sdl${{ matrix.sdl }}
          path: android-project/app/build/outputs/apk/debug/*.apk

  macos:
    # macOS 27 and Xcode 27 (the SDKs for iOS 27 and macOS 27), a preview image
    runs-on: xcode-27
    # Not required: GitHub's macOS runners sometimes leave the job without a
    # machine until it is cancelled. A failure here is still shown, and
    # looked at, but does not make the run fail (CONTRIBUTING.md).
    continue-on-error: true
    timeout-minutes: 30
    name: macos (${{ matrix.window.name }})
    strategy:
      matrix:
        window:
          - { name: glfw, cmake: "-DAURORE_WINDOW=GLFW" }
          - { name: sdl2, cmake: "-DAURORE_WINDOW=SDL2" }
          - { name: sdl3, cmake: "-DAURORE_WINDOW=SDL3" }
          # SDL_GPU on Metal
          - { name: sdlgpu, cmake: "-DAURORE_GRAPHICS=SDLGPU" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAURORE_PLATFORM=DESKTOP -DBUNDLE_MACOS_APP=ON ${{ matrix.window.cmake }}
          make -C build -j$(sysctl -n hw.ncpu)
          mkdir aurore-macos-${{ matrix.window.name }}
          mv build/aurore_demo.app aurore-macos-${{ matrix.window.name }}/
          tar -czvf aurore-macos-${{ matrix.window.name }}.tar.gz aurore-macos-${{ matrix.window.name }}
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-macos-${{ matrix.window.name }}
          path: aurore-macos-${{ matrix.window.name }}.tar.gz

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # SDL3 by default; GLFW kept
        driver: [gl, gl-glfw, sdlgpu]
        include:
          # SDL_GPU on Direct3D 12
          - { driver: sdlgpu, cmake: "-DAURORE_GRAPHICS=SDLGPU" }
          - { driver: gl-glfw, cmake: "-DAURORE_WINDOW=GLFW" }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: mingw64
          cache: false
          release: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cc
            mingw-w64-x86_64-ccache
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # MSYS2's ccache, its objects in GitHub's cache from one run to the next
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.driver }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.driver }}-
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPRESS: "1"
          CCACHE_MAXSIZE: 300M
        run: |
          cmake -B build -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURORE_PLATFORM=DESKTOP \
            -DAURORE_WIN32_TERMINAL=OFF \
            -DAURORE_LIBROMFS=ON \
            -DZLIB_USE_STATIC_LIBS=ON
          cmake --build build
          ccache --show-stats
      - name: Run the demo on Direct3D 12
        if: ${{ matrix.driver == 'sdlgpu' }}
        run: |
          # On the runner's software adapter (WARP): it passes if the demo
          # still runs after a while, drawn by Direct3D 12
          ./build/aurore_demo.exe > demo.log 2>&1 &
          pid=$!
          sleep 20
          cat demo.log
          kill -0 $pid
          kill $pid || true
          grep -q 'sdlgpu: direct3d12 driver' demo.log
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-windows-x86_64-${{ matrix.driver }}
          path: build/aurore_demo.exe

  linux:
    name: linux (${{ matrix.driver }}${{ matrix.ext }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { driver: gl2, cmake: "-DAURORE_GRAPHICS=GL2" }
          - { driver: gles2, cmake: "-DAURORE_GRAPHICS=GLES2" }
          - { driver: gles3, cmake: "-DAURORE_GRAPHICS=GLES3" }
          - { driver: gl3, cmake: "-DAURORE_WINDOW=GLFW", ext: "-glfw" }
          - { driver: gl3, cmake: "-DAURORE_WINDOW=SDL2", ext: "-sdl2" }
          - { driver: gl3, cmake: "-DAURORE_WINDOW=SDL3", ext: "-sdl3" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }} \
              -DAURORE_PLATFORM=DESKTOP \
              -DAURORE_LIBROMFS=ON
          make -C build -j$(nproc)
          output_dir=aurore-linux-x86_64-${{ matrix.driver }}${{ matrix.ext }}
          strip build/aurore_demo
          mkdir -p ${output_dir}
          mv build/aurore_demo ${output_dir}
          tar -czvf ${output_dir}.tar.gz ${output_dir}
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-linux-x86_64-${{ matrix.driver }}${{ matrix.ext }}
          path: aurore-linux-x86_64-${{ matrix.driver }}${{ matrix.ext }}.tar.gz
  linux-run:
    name: linux (demo run, ${{ matrix.window }}, ASan + UBSan)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { window: sdl3, cmake: "" }
          - { window: glfw, cmake: "-DAURORE_WINDOW=GLFW" }
          # SDL_GPU on Mesa's software Vulkan (lavapipe)
          - { window: sdlgpu, cmake: "-DAURORE_GRAPHICS=SDLGPU" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev xvfb xdotool dbus
      - name: Install Vulkan and glslang
        if: ${{ matrix.window == 'sdlgpu' }}
        run: sudo apt install -y --no-install-recommends mesa-vulkan-drivers glslang-tools ninja-build
      - name: SDL_shadercross cache
        if: ${{ matrix.window == 'sdlgpu' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/shadercross/bin
          key: shadercross-ubuntu-26.04-${{ hashFiles('tools/build_shadercross.sh') }}
      - name: Check the SDL_GPU shaders
        if: ${{ matrix.window == 'sdlgpu' }}
        run: |
          # SPIR-V, and the MSL and DXIL SDL_shadercross makes from it
          tools/build_shadercross.sh
          python3 tools/make_sdlgpu_shaders.py --check
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --preset desktop-asan ${{ matrix.cmake }}
          cmake --build --preset desktop-asan
      - name: Run the demo
        env:
          # The demo is stopped from outside, so leaks at exit are not reported
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # Walks the tabs with the keyboard for a while, then stops the demo:
          # it passes if it was still running (a crash or a sanitizer report
          # ends it before)
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            ./build/desktop-asan/aurore_demo > demo.log 2>&1 &
            pid=$!
            sleep 10
            # F12 opens the inspector, follows the focus, browses the tree
            # and closes it
            for key in Down Down Down Down Down Down Return Escape Up Up Right Right Down Left Left \
                F12 Down Down F12 Down Down Up Left Right Return Escape F12 Down F12 F12; do
              xdotool key $key
              sleep 0.5
            done
            sleep 3
            if kill -0 $pid 2> /dev/null; then kill $pid; wait $pid; exit 0; fi
            wait $pid; echo "demo ended on its own: $?"; exit 1'
      - name: Drawn by SDL_GPU
        if: ${{ matrix.window == 'sdlgpu' }}
        run: "grep -q 'sdlgpu: vulkan driver' demo.log"
      - name: Demo log
        if: always()
        run: cat demo.log || true

  # The SDL driver's input on a virtual controller (tests/sdl_input_tests.cpp),
  # under SDL2 and SDL3: no display needed
  linux-sdl-tests:
    name: linux (SDL input tests, ${{ matrix.window }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        window: [ SDL2, SDL3 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev ninja-build libegl-dev
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAURORE_PLATFORM=DESKTOP \
            -DAURORE_WINDOW=${{ matrix.window }} -DAURORE_LIBROMFS=ON -DAURORE_BUILD_TESTS=ON
          cmake --build build --target aurore_sdl_input_tests
      - name: Run
        run: ctest --test-dir build -R aurore_sdl_input_tests --output-on-failure

  # The demo in a browser on SDL2 (-DAURORE_WINDOW=SDL2: Emscripten's SDL2
  # port), still an option. The site's workflow builds and publishes the SDL3
  # one, the default.
  web-sdl2:
    name: web (sdl2)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # The site's Emscripten (.github/workflows/site.yml), checked the same way
      EMSDK_VERSION: 6.0.13
      EMSDK_COMMIT: 35659964bc2762fffec0d257997fb61475f765b7
      # And its Playwright and Pillow, for tools/web_smoke.py
      PLAYWRIGHT_VERSION: 1.64.0
      PILLOW_VERSION: 13.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.emscripten_cache
          key: emscripten-sdl2-${{ env.EMSDK_VERSION }}
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT" \
            || { echo "::error::emsdk's $EMSDK_VERSION tag is not $EMSDK_COMMIT any more"; exit 1; }
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q --no-install-recommends ninja-build
          # After emsdk_env.sh, which unsets EM_CACHE
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export EM_CACHE="$HOME/.emscripten_cache"
          emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DAURORE_WINDOW=SDL2
          cmake --build build-web
      # The demo started in headless Chromium: its first screen, a key, the
      # service worker of GitHub Pages, the address' language and theme
      - name: The demo in Chromium (tools/web_smoke.py)
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION" "pillow==$PILLOW_VERSION"
          sudo "$RUNNER_TEMP/playwright/bin/python" -m playwright install-deps chromium
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/playwright/bin/python" -u tools/web_smoke.py build-web/web build-web/smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: aurore-web-sdl3-smoke
          path: build-web/smoke
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-web-sdl2
          path: build-web/web
          retention-days: 7

  docs:
    name: API reference (Doxygen)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Doxygen and Python-Markdown
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends doxygen python3-markdown
      # Doxygen fails on a warning (WARN_AS_ERROR in docs/Doxyfile); the
      # pages fail on a name of the home page the headers lost, or on a
      # comment's markup they cannot show. The website (site.yml) publishes
      # them.
      - name: Build the reference
        run: |
          doxygen docs/Doxyfile
          python3 tools/build_api.py build_docs/xml build_api

  # The libFuzzer targets of tests/fuzz (docs/testing.md), a few minutes
  # each: Cadran's Markdown and a theme file, under AddressSanitizer and
  # UndefinedBehaviorSanitizer. The corpus each grows is kept from one run to
  # the next; an input that crashes goes up as an artifact.
  fuzz:
    name: linux (fuzz)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends clang-22 libclang-rt-22-dev ninja-build \
            libdbus-1-dev libxkbcommon-dev libwayland-dev wayland-protocols xorg-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAURORE_PLATFORM=DESKTOP \
            -DAURORE_WINDOW=GLFW -DAURORE_LIBROMFS=ON -DAURORE_BUILD_TESTS=ON -DAURORE_BUILD_FUZZERS=ON
          cmake --build build-fuzz --target aurore_fuzz_markdown aurore_fuzz_theme
      - name: Fuzz
        run: |
          mkdir -p fuzz-corpus/markdown fuzz-corpus/theme fuzz-crashes
          # Each grows its corpus from the repository's own files
          build-fuzz/tests/aurore_fuzz_markdown -max_total_time=120 -max_len=16384 -timeout=10 \
            -artifact_prefix=fuzz-crashes/markdown- fuzz-corpus/markdown docs
          build-fuzz/tests/aurore_fuzz_theme -max_total_time=120 -max_len=8192 -timeout=10 \
            -artifact_prefix=fuzz-crashes/theme- fuzz-corpus/theme resources/themes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz-crashes
          retention-days: 30

  linux-tests:
    name: linux (tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies
        run: |
          # EGL and Mesa's software renderer: the harness draws with no display
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev ninja-build \
            libegl-dev libegl1 libegl-mesa0 libgl1-mesa-dri
          # A system font for Chinese, Japanese and Korean, which the library
          # finds with fontconfig (the case cjk_from_the_system_fonts)
          sudo apt install -y --no-install-recommends fontconfig fonts-wqy-microhei
          # tools/stack.py reads the workflows
          sudo apt install -y --no-install-recommends python3-yaml
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ strategy.job-index }}
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # A deprecated API is an error, the vendored code's included: the
          # README's "Under the hood" says so
          CFLAGS: -Werror=deprecated-declarations
          CXXFLAGS: -Werror=deprecated-declarations
        run: |
          cmake --preset tests
          cmake --build --preset tests
      - name: Third-party notices
        # Each vendored component and font listed, the versions they say (needs the submodules)
        run: python3 tools/check_notices.py
      - name: Under the hood
        # The README's versions and figures, as the repository has them
        run: python3 tools/stack.py --check
      - name: Test
        run: ctest --preset tests
      - name: Bench
        if: always()
        run: ./build/tests/tests/aurore_bench --json bench.json
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurore-test-output
          path: build/tests/tests/test-output

  linux-variants:
    name: linux (variants, ${{ matrix.variant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # tools/ci_variant.sh says what each one builds
        variant: [ presets, install, fetch, fonts, unity, template ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev ninja-build pkg-config \
            libegl-dev libegl1 libegl-mesa0 libgl1-mesa-dri libfreetype-dev libfribidi-dev
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.variant }}
      - name: Vendored versions
        if: ${{ matrix.variant == 'fetch' }}
        run: python3 tools/check_extern_versions.py
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: tools/ci_variant.sh ${{ matrix.variant }}

name: Build the Aurore demo

on:
  push:
  pull_request:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: cache
        id: cache-key
        run: echo "IOS_CACHE_KEY=ios-cmake-build-dir-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '.github/workflows/ci.yaml') }}" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: ios-cache
        with:
          path: build
          key: ${{ steps.cache-key.outputs.IOS_CACHE_KEY }}
      - name: Build
        run: |
          ./build_libromfs_generator.sh
          cmake -B build -G Xcode -DPLATFORM_IOS=ON -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=13.0
          cmake --build build
          ditto -ck --rsrc --sequesterRsrc --keepParent build/Debug-iphoneos/aurore_demo.app aurore_demo.zip
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ !steps.ios-cache.outputs.cache-hit }}
        with:
          path: build
          key: ${{ steps.cache-key.outputs.IOS_CACHE_KEY }}
      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-ios
          path: aurore_demo.zip

  ps4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Build
        run: |
          docker run --rm -v $(pwd):/src/ xfangfang/pacbrew:latest \
            "cmake -B build -DPLATFORM_PS4=ON \
                -DCMAKE_BUILD_TYPE=Release && \
                make -C build -j$(nproc)"
      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-ps4
          path: build/*.pkg

  psv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: gxm }
          - { driver: gles2 }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Build GLES2
        if: ${{ matrix.driver == 'gles2' }}
        run: |
          docker run --rm -v $(pwd):/src/ xfangfang/vitasdk_sdl2_gles2:latest \
            "cmake -B build -G Ninja -DPLATFORM_PSV=ON -DUSE_SYSTEM_SDL2=ON -DCMAKE_BUILD_TYPE=Release && \
             cmake --build build"

      - name: Build GXM
        if: ${{ matrix.driver == 'gxm' }}
        run: |
          echo "cd /src" > build_gxm.sh
          echo "cmake -B build -DPLATFORM_PSV=ON -DCMAKE_BUILD_TYPE=Release -DUSE_GXM=ON" >> build_gxm.sh
          echo "cmake --build build -- -j$(nproc)" >> build_gxm.sh
          docker run --rm -v $(pwd):/src/ vitasdk/vitasdk:latest sh -C /src/build_gxm.sh

      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-psv-${{ matrix.driver }}
          path: build/*.vpk

  switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64
    strategy:
      fail-fast: false
      matrix:
        driver: [ glfw, sdl2, deko3d ]
        include:
          - { driver: glfw, cmake: "-DUSE_GLFW=ON", ext: "gl3-glfw" }
          - { driver: sdl2, cmake: "-DUSE_SDL2=ON", ext: "gl3-sdl2" }
          - { driver: deko3d, cmake: "-DUSE_DEKO3D=ON", ext: "deko3d" }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON ${{ matrix.cmake }}
          make -C build aurore_demo.nro -j$(nproc)
      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-switch-${{ matrix.ext }}
          path: build/aurore_demo.nro

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build pkg-config
      - name: Build
        id: build
        run: |
          ./build_libromfs_generator.sh
          cd android-project && ./gradlew assembleDebug
      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-android
          path: android-project/app/build/outputs/apk/debug/*.apk

  macos:
    runs-on: macos-14
    name: macos (${{ matrix.window.name }})
    strategy:
      matrix:
        window:
          - { name: glfw, cmake: "-DUSE_GLFW=ON" }
          - { name: sdl2, cmake: "-DUSE_SDL2=ON" }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPLATFORM_DESKTOP=ON -DBUNDLE_MACOS_APP=ON ${{ matrix.window.cmake }}
          make -C build -j$(sysctl -n hw.ncpu)
          mkdir aurore-macos-${{ matrix.window.name }}
          mv build/aurore_demo.app aurore-macos-${{ matrix.window.name }}/
          tar -czvf aurore-macos-${{ matrix.window.name }}.tar.gz aurore-macos-${{ matrix.window.name }}
      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-macos-${{ matrix.window.name }}
          path: aurore-macos-${{ matrix.window.name }}.tar.gz

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [gl, d3d11]
        include:
          - { driver: d3d11, cmake: "-DUSE_D3D11=ON" }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: mingw64
          cache: false
          release: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cc
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_LIBROMFS=ON \
            -DZLIB_USE_STATIC_LIBS=ON
          cmake --build build
      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-windows-x86_64-${{ matrix.driver }}
          path: build/aurore_demo.exe

  linux:
    name: linux (${{ matrix.driver }}${{ matrix.ext }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { driver: gl2, cmake: "-DUSE_GL2=ON" }
          - { driver: gles2, cmake: "-DUSE_GLES2=ON" }
          - { driver: gles3, cmake: "-DUSE_GLES3=ON" }
          - { driver: gl3, cmake: "-DUSE_GLFW=ON", ext: "-glfw" }
          - { driver: gl3, cmake: "-DUSE_SDL2=ON", ext: "-sdl2" }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }} \
              -DPLATFORM_DESKTOP=ON \
              -DUSE_LIBROMFS=ON
          make -C build -j$(nproc)
          output_dir=aurore-linux-x86_64-${{ matrix.driver }}${{ matrix.ext }}
          strip build/aurore_demo
          mkdir -p ${output_dir}
          mv build/aurore_demo ${output_dir}
          tar -czvf ${output_dir}.tar.gz ${output_dir}
      - name: Upload dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-linux-x86_64-${{ matrix.driver }}${{ matrix.ext }}
          path: aurore-linux-x86_64-${{ matrix.driver }}${{ matrix.ext }}.tar.gz
  linux-run:
    name: linux (demo run, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev xvfb xdotool dbus
      - name: Build
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPLATFORM_DESKTOP=ON -DUSE_GLFW=ON -DUSE_LIBROMFS=ON
          make -C build -j$(nproc)
      - name: Run the demo
        env:
          # The demo is stopped from outside, so leaks at exit are not reported
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # Walks the tabs with the keyboard for a while, then stops the demo:
          # it passes if it was still running (a crash or a sanitizer report
          # ends it before)
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            ./build/aurore_demo > demo.log 2>&1 &
            pid=$!
            sleep 10
            for key in Down Down Down Down Down Down Return Escape Up Up Right Right Down Left Left; do
              xdotool key $key
              sleep 0.5
            done
            sleep 3
            if kill -0 $pid 2> /dev/null; then kill $pid; wait $pid; exit 0; fi
            wait $pid; echo "demo ended on its own: $?"; exit 1'
      - name: Demo log
        if: always()
        run: cat demo.log || true

  linux-tests:
    name: linux (tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          # EGL and Mesa's software renderer: the harness draws with no display
          sudo apt update -y
          sudo apt install -y --no-install-recommends libdbus-1-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols xorg-dev ninja-build \
            libegl-dev libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLATFORM_DESKTOP=ON -DUSE_GLFW=ON \
              -DUSE_LIBROMFS=ON -DBRLS_BUILD_TESTS=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurore-test-output
          path: build/tests/test-output

name: release-please

# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date (CHANGELOG.md, library/include/aurore/version.hpp)
# from the conventional commits. Merging it creates the vX.Y.Z tag and the
# GitHub release.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A hand-written summary, .github/release-notes/X.Y.Z.md, goes above
      # release-please's lists on the release page. None for that version: the
      # page stays as it is. Run again, it does not repeat itself.
      - name: Add the release summary
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-notes/$version.md?ref=$TAG" \
            -H 'Accept: application/vnd.github.raw' > summary.md || {
            echo "No summary for $version: the page stays as release-please wrote it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          gh release view "$TAG" --json body --jq .body > body.md
          if grep -qxF -- "$(head -n 1 summary.md)" body.md; then
            echo "$TAG already has its summary." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { cat summary.md; printf '\n\n'; cat body.md; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          echo "$TAG: summary added from .github/release-notes/$version.md" >> "$GITHUB_STEP_SUMMARY"

  # boreale.dev shows each project's latest version: tell it once the release
  # is out. Needs BOREALE_DISPATCH_TOKEN, a token allowed to send
  # repository_dispatch to JigSawFr/boreale (Contents: read and write on it
  # alone); without it, boreale.dev catches up within a day.
  boreale:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Tell boreale.dev
        env:
          BOREALE_DISPATCH_TOKEN: ${{ secrets.BOREALE_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$BOREALE_DISPATCH_TOKEN" ]; then
            echo "No BOREALE_DISPATCH_TOKEN: boreale.dev shows $TAG at its daily build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GH_TOKEN="$BOREALE_DISPATCH_TOKEN" gh api repos/JigSawFr/boreale/dispatches -f event_type=release > /dev/null \
            && echo "$TAG: boreale.dev told" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::$TAG: boreale.dev not told (its daily build will show the release)"

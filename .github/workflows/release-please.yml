name: release-please

# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date (CHANGELOG.md, library/include/aurore/version.hpp)
# from the conventional commits. Merging it creates the vX.Y.Z tag and the
# GitHub release.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

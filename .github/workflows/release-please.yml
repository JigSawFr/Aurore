name: release-please

# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date (CHANGELOG.md, library/include/aurore/version.hpp)
# from the conventional commits. Merging it creates the vX.Y.Z tag and the
# GitHub release.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # What the release carries: the template (a minimal app) and the API
  # reference as web pages, their SHA-256 sums and the provenance of both.
  # Without them the page is still laid out, and Actions › release-page lays
  # it out again.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: true   # library/boreale-site: build_api.py builds on build_site.py
      - name: Install Doxygen and Python-Markdown
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends doxygen python3-markdown zip
      - name: Build the assets
        run: |
          mkdir dist
          git archive --format=zip --prefix=aurore-template/ -o dist/aurore-template.zip HEAD:template
          doxygen docs/Doxyfile
          python3 tools/build_api.py build_docs/xml build_api
          (cd build_api && zip -qr ../dist/aurore-api.zip .)
          (cd dist && sha256sum aurore-template.zip aurore-api.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # gh attestation verify aurore-api.zip -R JigSawFr/Aurore
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/aurore-template.zip
            dist/aurore-api.zip
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" --clobber dist/aurore-template.zip dist/aurore-api.zip dist/SHA256SUMS.txt

  # The release page, as PlayGuard's: "Aurore X.Y.Z", the figures, the
  # hand-written summary (.github/release-notes/X.Y.Z.md, if there is one),
  # the commit list folded, how to use it, the build report and the
  # contributors (tools/release_page.sh). Actions › release-page lays out a
  # release again.
  page:
    needs: [release-please, assets]
    # Laid out even if the assets could not be built.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          sparse-checkout: |
            .github/release-notes
            tools/release_notes.py
            tools/release_page.sh
          sparse-checkout-cone-mode: false
      - name: Release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: tools/release_page.sh "$TAG" --apply

  # boreale.dev shows each project's latest version: tell it once the release
  # is out. Needs BOREALE_DISPATCH_TOKEN, a token allowed to send
  # repository_dispatch to JigSawFr/boreale (Contents: read and write on it
  # alone); without it, boreale.dev catches up within a day.
  boreale:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Tell boreale.dev
        env:
          BOREALE_DISPATCH_TOKEN: ${{ secrets.BOREALE_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$BOREALE_DISPATCH_TOKEN" ]; then
            echo "No BOREALE_DISPATCH_TOKEN: boreale.dev shows $TAG at its daily build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GH_TOKEN="$BOREALE_DISPATCH_TOKEN" gh api repos/JigSawFr/boreale/dispatches -f event_type=release > /dev/null \
            && echo "$TAG: boreale.dev told" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::$TAG: boreale.dev not told (its daily build will show the release)"

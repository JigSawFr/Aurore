name: upstream

# Every week, the components Aurore bundles or builds with against their
# latest stable release (tools/check_upstream.py). One issue, "Components
# behind their upstream", says which are behind: opened or updated when some
# are, closed when none is any more. Dependabot watches the actions and Gradle.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q --no-install-recommends python3-yaml
      - name: Compare
        id: compare
        run: |
          set +e
          python3 tools/check_upstream.py --behind > behind.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat behind.md
      - name: The issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.compare.outputs.status }}
        run: |
          title="Components behind their upstream"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$STATUS" = "1" ]; then
            {
              echo "These components have a newer stable release upstream than the one Aurore bundles or builds with:"
              echo
              cat behind.md
              echo
              echo "Checked by \`tools/check_upstream.py\` (the \`upstream\` workflow, every Monday) on $(date -u +%Y-%m-%d)."
              echo "A component brought up to date drops off this list; the issue closes once none is left."
            } > body.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
            fi
          elif [ "$STATUS" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every component is at its upstream's latest stable release."
            fi
          else
            echo "::error::tools/check_upstream.py failed"
            exit 1
          fi

# The licences of the files that cannot say theirs in a comment (data, images,
# fonts, documents) and of the code bundled in library/lib/extern and
# library/include/aurore/extern (https://reuse.software/spec-3.3/). The source
# files say theirs in their SPDX tags. resources/THIRD_PARTY_NOTICES.md lists
# the bundled components with their versions; `reuse lint` checks the whole in
# CI. Where several annotations name a file, the last one counts.
version = 1

# Aurore's own data: the build and CI files, the docs, the resources, the
# demo's and the ports' assets, the reference screenshots, the site
[[annotations]]
path = [
    ".clang-format", ".editorconfig", ".gitattributes", ".gitignore", ".gitmodules", ".git-blame-ignore-revs",
    ".release-please-manifest.json", "release-please-config.json", "CMakePresets.json",
    "AUTHORS", "NOTICE", "*.md", ".github/**", "docs/**",
    "android-project/**", "demo/**", "ps4/**", "psv/**", "ctr/**", "template/**", "web/**",
    "resources/**", "tests/**", "site/**",
]
precedence = "closest"
SPDX-FileCopyrightText = ["2019-2021 borealis contributors", "2026 JigSawFr"]
SPDX-License-Identifier = "Apache-2.0"

# The PS4 image's patch to LLVM's libc++ (ps4/scripts/Dockerfile)
[[annotations]]
path = "ps4/scripts/libcxx-ps4.patch"
precedence = "override"
SPDX-FileCopyrightText = ["LLVM project contributors", "2026 JigSawFr"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Cadran's catalogs (NOTICE)
[[annotations]]
path = "resources/i18n/*/cadran.json"
precedence = "closest"
SPDX-FileCopyrightText = "2026 JigSawFr"
SPDX-License-Identifier = "GPL-3.0-or-later"


plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.aurore.demo'
    // Google Play takes new apps and updates that target Android 16 (API 36)
    compileSdk = 36
    // NDK r30: 16 KB pages (which Google Play asks for), std::filesystem
    ndkVersion = '30.0.16248370'

    defaultConfig {
        applicationId = 'com.aurore.demo'
        // Android 5.0 and later
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        release {
            // keytool -genkey -alias aurore -keyalg RSA -keypass password -keystore aurore.jks -storepass password -validity 100000
            storeFile = file('aurore.jks')
            storePassword = 'password'
            keyAlias = 'aurore'
            keyPassword = 'password'
            // v1 for Android 5 and 6, v2 after
            enableV1Signing = true
            enableV2Signing = true
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            path = 'jni/CMakeLists.txt'
            version = '4.1.2'
        }
    }
    lint {
        abortOnError = false
    }
}
